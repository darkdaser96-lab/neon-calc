<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEON CALC</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#05060a; --panel:rgba(12,16,28,.72); --cyan:#00f0ff; --magenta:#ff2bd6; --amber:#ffb020; --text:#e8f6ff; --muted:#7a8aa3; }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;background:radial-gradient(800px 420px at 10% -10%,rgba(0,240,255,.12),transparent 55%),radial-gradient(640px 380px at 110% 110%,rgba(255,43,214,.14),transparent 50%),var(--bg);color:var(--text);font-family:"Share Tech Mono",ui-monospace,monospace}
    body{display:grid;place-items:start center;padding:16px 12px 28px}
    .wrap{width:min(420px,100%)}
    .brand{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;padding:0 4px}
    .brand h1{font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.28em;color:var(--cyan)}
    .brand span{font-size:11px;color:var(--muted)}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .tab{appearance:none;border:1px solid rgba(0,240,255,.25);background:rgba(255,255,255,.04);color:var(--text);font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.08em;height:42px;border-radius:12px;cursor:pointer}
    .tab.on{color:#140016;background:linear-gradient(180deg,#ff4de4,#c4009a);border:none}
    .calc,.hist{background:var(--panel);border:1px solid rgba(0,240,255,.28);border-radius:24px;padding:16px;backdrop-filter:blur(16px)}
    .hidden{display:none}
    .screen{background:linear-gradient(180deg,rgba(4,8,16,.95),rgba(8,12,22,.8));border:1px solid rgba(0,240,255,.18);border-radius:14px;padding:14px;margin-bottom:14px;min-height:96px}
    .screen-top{display:flex;justify-content:space-between;gap:10px}
    .mem-flag{font-family:Orbitron,sans-serif;font-size:11px;color:transparent}
    .mem-flag.on{color:var(--magenta)}
    .expr{min-height:20px;color:var(--muted);font-size:13px;text-align:right;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .value{font-family:Orbitron,sans-serif;font-weight:700;font-size:clamp(26px,8vw,38px);text-align:right;margin-top:8px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    button.key{appearance:none;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:var(--text);font-family:Orbitron,sans-serif;font-size:16px;font-weight:700;height:54px;border-radius:14px;cursor:pointer}
    button.key:active{transform:scale(.96)}
    button.key.kbd{transform:scale(.96);filter:brightness(1.35)}
    .op{color:var(--cyan);border-color:rgba(0,240,255,.28)}
    .eq{color:#140016;background:linear-gradient(180deg,#ff4de4,#c4009a);border:none}
    .fn{color:var(--amber)}
    .mem{color:var(--magenta);font-size:12px}
    .zero{grid-column:span 2}
    .hist h2{font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.16em;color:var(--cyan);margin-bottom:10px}
    .hist-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
    .hist-item{border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;cursor:pointer}
    .hist-item small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
    .empty{color:var(--muted);text-align:center;padding:28px 8px}
    .hint{margin-top:12px;text-align:center;font-size:11px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><h1>NEON CALC</h1><span id="who">MINI APP</span></div>
    <div class="tabs">
      <button class="tab" id="tabCalc" type="button">ИСТОРИЯ</button>
      <button class="tab" id="tabDice" type="button">КУБИК</button>
    </div>
    <div class="calc" id="viewCalc">
      <div class="screen"><div class="screen-top"><div class="mem-flag" id="memFlag">M</div><div class="expr" id="expr"></div></div><div class="value" id="display">0</div></div>
      <div class="grid" id="grid">
        <button class="key mem" type="button" data-act="mc">MC</button>
        <button class="key mem" type="button" data-act="mr">MR</button>
        <button class="key mem" type="button" data-act="mplus">M+</button>
        <button class="key mem" type="button" data-act="mminus">M-</button>
        <button class="key fn" type="button" data-act="clear">AC</button>
        <button class="key fn" type="button" data-act="sign">±</button>
        <button class="key fn" type="button" data-act="percent">%</button>
        <button class="key op" type="button" data-op="/">÷</button>
        <button class="key" type="button" data-num="7">7</button>
        <button class="key" type="button" data-num="8">8</button>
        <button class="key" type="button" data-num="9">9</button>
        <button class="key op" type="button" data-op="*">×</button>
        <button class="key" type="button" data-num="4">4</button>
        <button class="key" type="button" data-num="5">5</button>
        <button class="key" type="button" data-num="6">6</button>
        <button class="key op" type="button" data-op="-">−</button>
        <button class="key" type="button" data-num="1">1</button>
        <button class="key" type="button" data-num="2">2</button>
        <button class="key" type="button" data-num="3">3</button>
        <button class="key op" type="button" data-op="+">+</button>
        <button class="key zero" type="button" data-num="0">0</button>
        <button class="key" type="button" data-num=".">.</button>
        <button class="key eq" type="button" data-act="eq">=</button>
      </div>
    </div>
    <div class="hist hidden" id="viewHist"><h2>ПОСЛЕДНИЕ СЧЁТЫ</h2><div class="hist-list" id="histList"></div></div>
    <p class="hint">История только на этом устройстве · Кубик кидает 1–100</p>
  </div>
  <script>
  (function(){
    const tg=window.Telegram&&window.Telegram.WebApp;
    if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#05060a");tg.setBackgroundColor("#05060a")}catch(e){}
      const name=(tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||"MINI APP";
      document.getElementById("who").textContent=name}
    const display=document.getElementById("display"),exprEl=document.getElementById("expr"),memFlag=document.getElementById("memFlag");
    const viewCalc=document.getElementById("viewCalc"),viewHist=document.getElementById("viewHist"),histList=document.getElementById("histList");
    let current="0",stored=null,op=null,fresh=false,memory=0,history=[];
    try{memory=Number(localStorage.getItem("neon-mem")||0)||0}catch(e){}
    try{history=JSON.parse(localStorage.getItem("neon-hist")||"[]")}catch(e){history=[]}
    function fmt(n){const num=Number(n);if(!Number.isFinite(num))return"ERR";const s=String(num);return s.length>14?num.toExponential(6):s}
    function save(){try{localStorage.setItem("neon-mem",String(memory));localStorage.setItem("neon-hist",JSON.stringify(history.slice(0,20)))}catch(e){}}
    function render(){display.textContent=current;exprEl.textContent=stored!==null&&op?fmt(stored)+" "+op:"";memFlag.classList.toggle("on",memory!==0)}
    function renderHist(){if(!history.length){histList.innerHTML='<div class="empty">Пока пусто. Посчитай что-нибудь и жми =</div>';return}
      histList.innerHTML=history.map(function(item,i){return '<div class="hist-item" data-i="'+i+'"><small>'+item.expr+'</small>'+item.result+'</div>'}).join('')}
    function show(which){const histMode=which==="hist";viewCalc.classList.toggle("hidden",histMode);viewHist.classList.toggle("hidden",!histMode);document.getElementById("tabCalc").classList.toggle("on",histMode);document.getElementById("tabDice").classList.toggle("on",!histMode);if(histMode)renderHist()}
    function inputNum(d){if(fresh){current=d==="."?"0.":d;fresh=false}else if(d==="."){if(current.indexOf(".")===-1)current+="."}else current=current==="0"?d:current+d;render()}
    function apply(){if(stored===null||!op)return Number(current);const a=Number(stored),b=Number(current);if(op==="+")return a+b;if(op==="-")return a-b;if(op==="*")return a*b;if(op==="/")return b===0?NaN:a/b;return b}
    function setOp(next){if(stored!==null&&!fresh)stored=apply();else stored=Number(current);op=next;current=fmt(stored);fresh=true;render()}
    function equals(){if(op===null)return;const left=fmt(stored),right=current,sign=op;current=fmt(apply());history.unshift({expr:left+" "+sign+" "+right,result:current});stored=null;op=null;fresh=true;save();render()}
    function handle(btn){if(!btn)return;const num=btn.getAttribute("data-num"),nextOp=btn.getAttribute("data-op"),act=btn.getAttribute("data-act");
      if(num!==null)inputNum(num);else if(nextOp)setOp(nextOp);else if(act==="clear"){current="0";stored=null;op=null;fresh=false;render()}
      else if(act==="sign"){if(current!=="0")current=current.charAt(0)==="-"?current.slice(1):"-"+current;render()}
      else if(act==="percent"){current=fmt(Number(current)/100);render()}else if(act==="eq")equals();
      else if(act==="mc"){memory=0;save();render()}else if(act==="mr"){current=fmt(memory);fresh=true;render()}
      else if(act==="mplus"){memory+=Number(current)||0;save();fresh=true;render()}else if(act==="mminus"){memory-=Number(current)||0;save();fresh=true;render()}}
    document.getElementById("grid").addEventListener("click",function(e){handle(e.target.closest("button"))});
    document.getElementById("tabCalc").addEventListener("click",function(){show("hist")});
    document.getElementById("tabDice").addEventListener("click",function(){show("calc");current=String(1+Math.floor(Math.random()*100));stored=null;op=null;fresh=true;render();if(tg&&tg.HapticFeedback)try{tg.HapticFeedback.impactOccurred("light")}catch(e){}});
    histList.addEventListener("click",function(e){const item=e.target.closest(".hist-item");if(!item)return;const rec=history[Number(item.getAttribute("data-i"))];if(!rec)return;current=rec.result;stored=null;op=null;fresh=true;show("calc");render()});
    function backspace(){if(fresh)return;if(!/^-?\d*\.?\d*$/.test(current)){current="0";render();return}
      let next=current.slice(0,-1);if(next===""||next==="-"||next==="-0")next="0";current=next;render()}
    const keyBtn=function(sel){return document.querySelector("#grid "+sel)};
    function flash(btn){if(!btn)return;btn.classList.add("kbd");setTimeout(function(){btn.classList.remove("kbd")},120)}
    function keyToButton(e){const k=e.key,c=e.code||"";
      let m=/^Numpad([0-9])$/.exec(c);if(m)return keyBtn('[data-num="'+m[1]+'"]');
      if(/^[0-9]$/.test(k))return keyBtn('[data-num="'+k+'"]');
      if(c==="NumpadDecimal"||k==="."||k===",")return keyBtn('[data-num="."]');
      const ops={NumpadAdd:"+",NumpadSubtract:"-",NumpadMultiply:"*",NumpadDivide:"/"};
      if(ops[c])return keyBtn('[data-op="'+ops[c]+'"]');
      if(k==="+"||k==="-"||k==="*"||k==="/")return keyBtn('[data-op="'+k+'"]');
      if(k==="Enter"||c==="NumpadEnter"||k==="=")return keyBtn('[data-act="eq"]');
      if(k==="Escape"||k==="Delete"||k==="c"||k==="C"||c==="KeyC")return keyBtn('[data-act="clear"]');
      if(k==="%")return keyBtn('[data-act="percent"]');
      return null}
    document.addEventListener("keydown",function(e){
      if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
      const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable))return;
      const isBack=e.key==="Backspace",btn=isBack?null:keyToButton(e);
      if(!isBack&&!btn)return;
      e.preventDefault();
      if(document.activeElement&&document.activeElement.tagName==="BUTTON")document.activeElement.blur();
      if(e.repeat&&btn&&btn.getAttribute("data-act"))return;
      if(viewCalc.classList.contains("hidden"))show("calc");
      if(isBack)backspace();else{handle(btn);flash(btn)}
    });
    const start=new URLSearchParams(location.search).get("start")||"";
    if(start==="history")show("hist");else{show("calc");if(start==="dice"){current=String(1+Math.floor(Math.random()*100));stored=null;op=null;fresh=true}}render();
  })();
  </script>
</body>
</html>
